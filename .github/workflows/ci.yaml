name: CI

# Fast feedback on every push and pull request. The heavyweight EDPS
# workflow run stays in run_edps.yaml on its nightly schedule.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pipx install ruff
      - name: Run ruff
        working-directory: metisp/pymetis
        run: ruff check src

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo ./toolbox/install_dependencies_ubuntu.sh
          python3 -m venv metispipe
          . metispipe/bin/activate
          export PYCPL_RECIPE_DIR="$(pwd)/metisp/pyrecipes/"
          export HDRL_INCLUDE_DIR="$(pwd)/cpl/lib"
          export HDRLDIR="$(pwd)/cpl"
          export CPLDIR=$HDRLDIR
          ./toolbox/install_cpl.sh
          ./toolbox/install_edps.sh
          ./toolbox/create_config.sh

      - name: Fetch test data
        run: |
          git clone https://github.com/AstarVienna/METIS_Pipeline_Test_Data.git
          # Try to checkout a branch in METIS_Pipeline_Test_Data that has
          # the same name as the branch in METIS_Pipeline that we are testing.
          git -C METIS_Pipeline_Test_Data checkout "${GITHUB_HEAD_REF}" || true


      - name: Run pytest
        working-directory: metisp/pymetis
        run: |
          . ../../metispipe/bin/activate
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/blas:/usr/lib/x86_64-linux-gnu/lapack:$(pwd)/../../cpl/lib:$LD_LIBRARY_PATH
          export PYESOREX_PLUGIN_DIR="${GITHUB_WORKSPACE}/metisp/pyrecipes/"
          export PYCPL_RECIPE_DIR="${GITHUB_WORKSPACE}/metisp/pyrecipes/"
          export PYTHONPATH="${GITHUB_WORKSPACE}/metisp/pymetis/src/"
          export SOF_DATA="${GITHUB_WORKSPACE}/METIS_Pipeline_Test_Data/small202402/outputSmall/"
          export SOF_DIR="${GITHUB_WORKSPACE}/METIS_Pipeline_Test_Data/small202402/sofFiles/"
          export PYESOREX_OUTPUT_DIR="$SOF_DATA"

          # `recipe`, `inputset` and `pyesorex` markers are deliberately NOT
          # deselected here (unlike the historical nightly run): these tests
          # must run on every change.
          python -m pytest src -q -m "not external and not edps"

      - name: Run EDPS JSON tests
        working-directory: metisp/pymetis/src/pymetis/instruments/metis/workflows/test
        run: |
          . "${GITHUB_WORKSPACE}/metispipe/bin/activate"
          # Same exclusions as in run_edps.yaml (26 known organization failures).
          python -m pytest -v json_tests.py \
            -k "not (IFU_Calibrate or IFU_Distortion or IFU_Full_Cascade or IFU_RSRF or \
                     IFU_Sci_Reduce or IFU_Sci_Telluric or IFU_Std_Reduce or IFU_Std_Telluric or IFU_Wavecal or \
                     LM_IMG_Background_Sci or LM_IMG_Background_Std or LM_IMG_Basic_Reduce_Sci or \
                     LM_IMG_Basic_Reduce_Sky or LM_IMG_Basic_Reduce_Std or LM_IMG_Calibrate or \
                     LM_IMG_Distortion or LM_IMG_Flat or LM_IMG_Full_Cascade or LM_IMG_Standard_Flux or \
                     N_IMG_Calibrate or N_IMG_Chopnod_Sci or N_IMG_Chopnod_Std or N_IMG_Distortion or \
                     N_IMG_Flat or N_IMG_Full_Cascade or N_IMG_Standard_Flux)"
