name: Install METIS_Pipeline through autotools

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every day at 2:00 UTC
    - cron: "0 2 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo ./toolbox/install_dependencies_ubuntu.sh
          python3 -m venv metispipe
          . metispipe/bin/activate
          export PYCPL_RECIPE_DIR="$(pwd)/metisp/pyrecipes/"
          export HDRL_INCLUDE_DIR="$(pwd)/cpl/lib"
          export HDRLDIR="$(pwd)/cpl"
          export CPLDIR=$HDRLDIR
          ./toolbox/install_cpl.sh
      - name: Run autotools
        run: |
          export LD_LIBRARY_PATH=$(pwd)/cpl/lib:$LD_LIBRARY_PATH
          cd metisp
          ./bootstrap
          ./configure
          make
          make python
          sudo make install
          sudo make install-python
